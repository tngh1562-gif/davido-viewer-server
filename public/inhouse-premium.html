<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>DAVIDO INHOUSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060709;
  --s1: #0a0c10;
  --s2: #0f1117;
  --s3: #161820;
  --border: rgba(255,255,255,.06);
  --b2: rgba(255,255,255,.03);
  --gold: #e8a020;
  --gold2: #ffc347;
  --blue: #0ea5e9;
  --blue2: #38bdf8;
  --red: #ef4444;
  --red2: #f87171;
  --green: #10b981;
  --text: #f8fafc;
  --t2: #94a3b8;
  --t3: #475569;
  --t4: #1e293b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Noto Sans KR','Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  font-size:12.5px;
  line-height:1.5;
}
select,input,button{font-family:inherit;font-size:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}

/* ─── SIDEBAR ─── */
.sb{
  width:52px;
  background:var(--s1);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px 0;
  gap:4px;
  flex-shrink:0;
  z-index:20;
}
.sb-logo{
  width:32px;height:32px;
  border-radius:8px;
  background:linear-gradient(135deg,#b87800,var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
  margin-bottom:14px;
  box-shadow:0 0 20px rgba(232,160,32,.3);
}
.sb-item{
  width:36px;height:36px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
  color:var(--t3);
  cursor:pointer;
  transition:all .15s;
  position:relative;
}
.sb-item:hover{background:var(--s2);color:var(--t2)}
.sb-item.on{
  background:rgba(232,160,32,.12);
  color:var(--gold);
}
.sb-item.on::before{
  content:'';
  position:absolute;
  left:-1px;top:20%;bottom:20%;
  width:2px;border-radius:0 2px 2px 0;
  background:var(--gold);
}
.sb-div{width:24px;height:1px;background:var(--border);margin:6px 0}
.sb-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#b87800,var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;font-weight:900;color:#000;
  margin-top:auto;
  cursor:pointer;
}
[title]:hover::after{
  content:attr(title);
  position:absolute;left:52px;
  background:#1e293b;color:var(--text);
  font-size:.68rem;font-weight:600;
  padding:4px 8px;border-radius:5px;
  white-space:nowrap;pointer-events:none;
  z-index:100;border:1px solid var(--border);
}

/* ─── LAYOUT ─── */
.app{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ─── TOPBAR ─── */
.topbar{
  display:flex;align-items:center;
  padding:0 20px;
  height:48px;
  border-bottom:1px solid var(--border);
  background:rgba(6,7,9,.8);
  backdrop-filter:blur(12px);
  gap:12px;
  flex-shrink:0;
}
.tb-breadcrumb{
  display:flex;align-items:center;gap:8px;
  font-size:.72rem;color:var(--t3);
}
.tb-breadcrumb span{color:var(--text);font-weight:700;font-size:.78rem}
.tb-sep{color:var(--t4)}
.live-dot{
  display:flex;align-items:center;gap:5px;
  padding:3px 8px;border-radius:20px;
  background:rgba(16,185,129,.1);
  border:1px solid rgba(16,185,129,.2);
  font-size:.6rem;font-weight:800;letter-spacing:.5px;
  color:var(--green);
}
.live-dot::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--green);
  animation:blink 1.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-btn{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:6px;border:none;
  font-size:.7rem;font-weight:700;
  transition:all .12s;
}
.tb-btn-ghost{background:transparent;border:1px solid var(--border);color:var(--t2)}
.tb-btn-ghost:hover{border-color:rgba(255,255,255,.15);color:var(--text)}
.tb-btn-danger{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);color:var(--red2)}

/* ─── TOOLBAR ─── */
.toolbar{
  display:flex;align-items:center;gap:6px;
  padding:8px 20px;
  border-bottom:1px solid var(--border);
  background:var(--s1);
  flex-shrink:0;flex-wrap:wrap;
}
.ctrl-sel{
  padding:5px 9px;border-radius:6px;
  background:var(--s2);border:1px solid var(--border);
  color:var(--t2);font-size:.7rem;cursor:pointer;
  transition:all .12s;
}
.ctrl-sel:hover{border-color:rgba(255,255,255,.12);color:var(--text)}
.ctrl-label{font-size:.65rem;color:var(--t3);padding:0 2px}
.v-div{width:1px;height:18px;background:var(--border);margin:0 2px}
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:6px;border:none;
  font-size:.7rem;font-weight:700;
  transition:all .15s;white-space:nowrap;
}
.btn-primary{
  background:linear-gradient(135deg,#b87800,var(--gold));
  color:#000;
  box-shadow:0 2px 12px rgba(232,160,32,.25);
}
.btn-primary:hover{box-shadow:0 2px 20px rgba(232,160,32,.45);filter:brightness(1.06)}
.btn-sub{background:var(--s2);border:1px solid var(--border);color:var(--t2)}
.btn-sub:hover{border-color:rgba(255,255,255,.14);color:var(--text)}
.btn-red{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);color:var(--red2)}
.btn-red:hover{background:rgba(239,68,68,.15)}
/* 인포칩 */
.chips{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  padding:6px 20px;border-bottom:1px solid var(--b2);
  background:var(--bg);flex-shrink:0;
}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:20px;
  font-size:.62rem;font-weight:600;white-space:nowrap;
}
.ch-act{background:var(--s2);border:1px solid var(--border);color:var(--t2);cursor:pointer}
.ch-act:hover{border-color:var(--gold);color:var(--gold)}
.ch-info{background:transparent;border:1px solid var(--b2);color:var(--t3)}
.ch-warn{background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.2);color:#fb923c}
.ch-add{background:rgba(232,160,32,.08);border:1px solid rgba(232,160,32,.2);color:var(--gold);cursor:pointer}
.ch-add:hover{background:rgba(232,160,32,.14)}

/* ─── BODY ─── */
.body{flex:1;display:flex;overflow:hidden}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ─── MATCH HEADER ─── */
.match-header{
  display:grid;
  grid-template-columns:1fr 120px 1fr;
  gap:0;
  padding:20px 20px 0;
  flex-shrink:0;
}
.team-col{
  display:flex;flex-direction:column;
}
/* 블루팀 */
.team-col.blue .team-tag{
  display:flex;align-items:center;gap:8px;
  padding:14px 18px 12px;
  background:linear-gradient(135deg,rgba(14,165,233,.1) 0%,rgba(14,165,233,.03) 100%);
  border:1px solid rgba(14,165,233,.2);
  border-radius:12px 12px 0 0;
  border-bottom:none;
}
.team-col.red .team-tag{
  display:flex;align-items:center;gap:8px;
  padding:14px 18px 12px;
  background:linear-gradient(135deg,rgba(239,68,68,.1) 0%,rgba(239,68,68,.03) 100%);
  border:1px solid rgba(239,68,68,.2);
  border-radius:12px 12px 0 0;
  border-bottom:none;
  flex-direction:row-reverse;
}
.team-stripe{
  height:3px;border-radius:2px;flex-shrink:0;
  width:24px;
}
.team-stripe.b{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.team-stripe.r{background:var(--red);box-shadow:0 0 8px var(--red)}
.team-label{
  font-size:1.05rem;font-weight:900;letter-spacing:1px;
}
.team-label.b{color:var(--blue2)}
.team-label.r{color:var(--red2)}
.team-cnt{font-size:.62rem;color:var(--t3);margin-left:auto;font-weight:600}
.team-cnt.r{margin-left:0;margin-right:auto}

/* 팀 바디 */
.team-body{
  border:1px solid;
  border-top:none;
  border-radius:0 0 12px 12px;
  min-height:72px;
  display:flex;align-items:center;justify-content:center;
  padding:14px 16px;
}
.team-body.b{
  border-color:rgba(14,165,233,.15);
  background:linear-gradient(180deg,rgba(14,165,233,.04),transparent);
}
.team-body.r{
  border-color:rgba(239,68,68,.15);
  background:linear-gradient(180deg,rgba(239,68,68,.04),transparent);
}
.empty-msg{font-size:.7rem;color:var(--t4);font-style:italic}

/* VS 구분자 */
.vs-col{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding-bottom:0;
  position:relative;
}
.vs-text{
  font-size:1.5rem;font-weight:900;
  color:var(--t4);letter-spacing:2px;
  font-style:italic;
}

/* ─── PARTICIPANTS ─── */
.participants{
  padding:16px 20px;
  display:flex;flex-direction:column;gap:12px;
}
.pg-title{
  display:flex;align-items:center;gap:10px;
  font-size:.62rem;font-weight:800;color:var(--t3);
  text-transform:uppercase;letter-spacing:2px;
}
.pg-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

.prow{
  display:grid;
  grid-template-columns:20px 1fr 72px 68px 68px 68px 22px;
  align-items:center;gap:6px;
  padding:7px 10px;
  border-radius:8px;
  background:var(--s1);
  border:1px solid var(--b2);
  transition:all .12s;
}
.prow:hover{background:var(--s2);border-color:var(--border)}
.prow:focus-within{border-color:rgba(232,160,32,.25)}
.pn{font-size:.62rem;color:var(--t4);font-weight:800;text-align:right}
.psel{
  background:transparent;border:none;
  color:var(--t2);font-size:.72rem;padding:0 4px;
  cursor:pointer;width:100%;
}
.psel:focus{outline:none;color:var(--text)}
.tier{
  padding:3px 7px;border-radius:4px;
  font-size:.6rem;font-weight:800;
  background:rgba(232,160,32,.08);
  color:var(--gold);
  border:1px solid rgba(232,160,32,.15);
  text-align:center;white-space:nowrap;
}
.msel{
  background:var(--s2);border:1px solid var(--b2);
  border-radius:4px;color:var(--t3);
  font-size:.62rem;padding:3px 4px;width:100%;
}
.msel:focus{outline:none;border-color:rgba(232,160,32,.3)}
.delbtn{
  background:none;border:none;
  color:var(--t4);font-size:11px;padding:2px;
  border-radius:3px;transition:all .1s;
}
.delbtn:hover{color:var(--red2);background:rgba(239,68,68,.1)}

/* ─── RIGHT PANEL ─── */
.rp{
  width:220px;
  border-left:1px solid var(--border);
  background:var(--s1);
  display:flex;flex-direction:column;
  overflow-y:auto;
  flex-shrink:0;
}
.rp-block{
  padding:14px 14px;
  border-bottom:1px solid var(--b2);
}
.rp-head{
  font-size:.58rem;font-weight:800;color:var(--t3);
  text-transform:uppercase;letter-spacing:2px;
  margin-bottom:12px;
  display:flex;align-items:center;gap:7px;
}
.rp-head-line{width:10px;height:2px;background:var(--gold);border-radius:1px}

/* 스탯 */
.stat-row{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:6px;
}
.stat-label{font-size:.7rem;color:var(--t3)}
.stat-val{font-size:.75rem;font-weight:700;color:var(--t2)}
.stat-val.warn{color:#fb923c}

/* 도넛 차트 */
.donut-area{display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0 4px}
.donut{
  width:68px;height:68px;border-radius:50%;position:relative;
  background:conic-gradient(
    var(--blue) 0deg 180deg,
    var(--red) 180deg 360deg
  );
  box-shadow:0 0 24px rgba(14,165,233,.12),0 0 24px rgba(239,68,68,.08);
}
.donut-hole{
  position:absolute;inset:10px;border-radius:50%;
  background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  font-size:.58rem;font-weight:700;color:var(--t3);
}
.legend{display:flex;gap:12px}
.leg{display:flex;align-items:center;gap:4px;font-size:.62rem;color:var(--t2)}
.leg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* 도구 버튼 */
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tool-btn{
  padding:8px 6px;border-radius:7px;border:1px solid;
  font-size:.65rem;font-weight:700;cursor:pointer;
  font-family:inherit;text-align:center;
  line-height:1.3;transition:all .12s;
}
.t-gold{background:rgba(232,160,32,.07);border-color:rgba(232,160,32,.18);color:var(--gold)}
.t-gold:hover{background:rgba(232,160,32,.15);border-color:var(--gold)}
.t-neutral{background:rgba(255,255,255,.03);border-color:var(--border);color:var(--t3)}
.t-neutral:hover{background:rgba(255,255,255,.07);color:var(--t2)}
.t-blue{background:rgba(14,165,233,.07);border-color:rgba(14,165,233,.2);color:var(--blue2)}
.t-blue:hover{background:rgba(14,165,233,.14)}
.t-red{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.18);color:var(--red2)}
.t-red:hover{background:rgba(239,68,68,.14)}

.empty-rec{font-size:.68rem;color:var(--t4);text-align:center;padding:8px 0}

/* 시작 버튼 */
.start{
  margin:12px 14px;
  padding:13px;
  background:linear-gradient(135deg,#059669,var(--green));
  color:#000;font-weight:900;font-size:.82rem;
  border:none;border-radius:10px;
  cursor:pointer;font-family:inherit;
  letter-spacing:.3px;
  box-shadow:0 4px 20px rgba(16,185,129,.25);
  transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.start:hover{
  box-shadow:0 4px 28px rgba(16,185,129,.45);
  transform:translateY(-1px);
  filter:brightness(1.04);
}
.start:active{transform:none}
</style>
</head>
<body>

<!-- ICON SIDEBAR -->
<aside class="sb">
  <div class="sb-logo">⚔</div>
  <div class="sb-item on" title="내전 진행">⚔️</div>
  <div class="sb-item" title="내전 설정">⚙️</div>
  <div class="sb-item" title="Draft">🃏</div>
  <div class="sb-item" title="Records">📊</div>
  <div class="sb-div"></div>
  <div class="sb-item" title="시청자 DB">🗄️</div>
  <div class="sb-div"></div>
  <div class="sb-item" title="오버레이">📺</div>
  <div class="sb-item" title="치지직 봇">🤖</div>
  <div class="sb-item" title="룰렛 관리자">🎡</div>
  <div class="sb-item" title="설정">🔧</div>
  <div class="sb-avatar" title="다비도 · 관리자">다</div>
</aside>

<div class="app">
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="tb-breadcrumb">
      <span style="color:var(--t3)">DAVIDO</span>
      <span class="tb-sep">/</span>
      <span>내전 진행</span>
    </div>
    <div class="live-dot">LIVE</div>
    <div class="tb-right">
      <button class="tb-btn tb-btn-ghost">🔀 팀 전체 스왑</button>
      <button class="tb-btn tb-btn-danger">↺ 행단 초기화</button>
    </div>
  </header>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <select class="ctrl-sel"><option>5 vs 5</option><option>3 vs 3</option></select>
    <span class="ctrl-label">포지션 고려</span>
    <div class="v-div"></div>
    <button class="btn btn-primary">⚡ 자동 배정</button>
    <button class="btn btn-sub">🃏 밴픽</button>
    <button class="btn btn-sub">🗺 서울</button>
  </div>

  <!-- CHIPS -->
  <div class="chips">
    <button class="chip ch-act">✕ 밴픽 삭제</button>
    <span class="chip ch-info">인원 0/10</span>
    <span class="chip ch-info">0 MMR</span>
    <span class="chip ch-warn">⚠ 10명 부족</span>
    <button class="chip ch-add">+ 추가</button>
    <button class="chip ch-act">DB ↓</button>
    <button class="chip ch-act">버프 추가...</button>
  </div>

  <div class="body">
    <div class="main">

      <!-- MATCH HEADER -->
      <div class="match-header">
        <div class="team-col blue">
          <div class="team-tag">
            <div class="team-stripe b"></div>
            <span class="team-label b">BLUE</span>
            <span class="team-cnt">0 / 5</span>
          </div>
          <div class="team-body b">
            <span class="empty-msg">배정 후 표시</span>
          </div>
        </div>
        <div class="vs-col">
          <div class="vs-text">VS</div>
        </div>
        <div class="team-col red">
          <div class="team-tag">
            <span class="team-cnt r">0 / 5</span>
            <span class="team-label r">RED</span>
            <div class="team-stripe r"></div>
          </div>
          <div class="team-body r">
            <span class="empty-msg">배정 후 표시</span>
          </div>
        </div>
      </div>

      <!-- PARTICIPANTS -->
      <div class="participants">
        <div class="pg-title"><div class="pg-line"></div>참가자 1–5<div class="pg-line"></div></div>
        <div class="prow"><span class="pn">1</span><select class="psel"><option>+ DB에서 선택</option></select><span class="tier">골드 4</span><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><button class="delbtn">✕</button></div>
        <div class="prow"><span class="pn">2</span><select class="psel"><option>+ DB에서 선택</option></select><span class="tier">골드 4</span><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><button class="delbtn">✕</button></div>
        <div class="prow"><span class="pn">3</span><select class="psel"><option>+ DB에서 선택</option></select><span class="tier">골드 4</span><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><button class="delbtn">✕</button></div>
        <div class="prow"><span class="pn">4</span><select class="psel"><option>+ DB에서 선택</option></select><span class="tier">골드 4</span><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><button class="delbtn">✕</button></div>
        <div class="prow"><span class="pn">5</span><select class="psel"><option>+ DB에서 선택</option></select><span class="tier">골드 4</span><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><button class="delbtn">✕</button></div>
        <div class="pg-title" style="margin-top:4px"><div class="pg-line"></div>참가자 6–10<div class="pg-line"></div></div>
        <div class="prow"><span class="pn">6</span><select class="psel"><option>+ DB에서 선택</option></select><span class="tier">골드 4</span><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><select class="msel"><option>+무관</option></select><button class="delbtn">✕</button></div>
